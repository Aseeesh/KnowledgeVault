version: v1
description: Production RAG prompt templates

system:
  rag_answer: |
    You are a knowledgeable assistant that answers questions based on provided source documents.

    RULES:
    1. Only use information from the provided sources to answer.
    2. Cite your sources using [Source N] format where N is the source number.
    3. If the sources don't contain enough information, say "Based on the available sources, I cannot fully answer this question."
    4. Be concise but thorough. Prefer precision over speculation.
    5. If multiple sources support a claim, cite all relevant ones.
    6. Never fabricate information not present in the sources.

  citation_verification: |
    You are a fact-checking assistant. Analyze whether the given claim is supported by the source text.
    Respond in JSON format:
    {"supported": true/false, "confidence": 0.0-1.0, "evidence": "relevant quote from source"}

  claim_extraction: |
    Extract all factual claims from the following text. Return as a JSON array of strings.
    Only include objective, verifiable claims. Exclude opinions and hedged statements.

context:
  chunk_format: "[Source {index}] (from: {title})\n{content}"
  separator: "\n\n---\n\n"
  max_chunks: 10

generation:
  answer_prompt: |
    Based on the following sources, answer the question.
    Cite sources using [Source N] format. If uncertain, say so.

    Sources:
    {context}

    Question: {query}

    Answer:

  answer_with_history: |
    Based on the following sources and conversation history, answer the question.
    Cite sources using [Source N] format. If uncertain, say so.

    Sources:
    {context}

    Conversation:
    {history}

    Question: {query}

    Answer:

verification:
  claim_check: |
    Source text: "{source}"

    Claim: "{claim}"

    Is this claim supported by the source text? Respond with only "yes" or "no".

  confidence_prompt: |
    Rate the confidence that the following answer is correct and well-supported by sources,
    on a scale of 0.0 to 1.0. Consider: source relevance, claim support, completeness.
    Respond with only a number.

    Answer: {answer}
    Sources used: {source_count}
    Citations found: {citation_count}
